<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Where it lives: one place for everything</title>
  <desc id="desc">Your researcher's folder, every part with a purpose, and who writes it. Read first in every conversation: RESEARCHER.md, who you are, its voice and your rules, written by both of you; and Philosophy/, how you work and how you invest, in your own words. You write Sources/, what you give it: papers, books, clippings. Your researcher writes Knowledge/, its notes, each citing its source; Studies/, decisions weighed for and against; and Lessons/, lessons and their quizzes. The flow: Sources/, read, Knowledge/, then query, study and teach, into Studies/ and Lessons/, and you decide. It is all Markdown, plain text any assistant or editor reads, and git keeps every change.</desc>
  <style>
    .label { font: 700 14px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 3.5px; fill: #686661; }
    .head { font: 400 40px 'Archivo Black', 'Arial Black', Impact, sans-serif; fill: #121110; letter-spacing: -0.5px; }
    .dot { fill: #e84328; }
    .key { font: 700 12px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 2px; fill: #56534e; }
    .name { font: 700 21px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #121110; }
    .text { font: 400 17px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3a3833; }
    .first { font: 700 10.5px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1.5px; fill: #b8321a; }
    .flow { font: 700 19px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #f2f0eb; }
    .flow-red { font: 700 19px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #f0664e; }
    .flow-grey { font: 400 19px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9c6be; }
    .decide { font: 700 15px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1.5px; fill: #f0664e; }
    .md { font: 400 17px 'Archivo Black', 'Arial Black', Impact, sans-serif; fill: #e84328; }
    .md-text { font: 400 17px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3a3833; }
    .foot { font: 400 14px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #56534e; letter-spacing: 0.5px; }
  </style>
