  <text x="710" y="304" class="who">Your researcher</text>
  <text x="710" y="332" class="say">Step 5, the backtest. Plan: one Backtest</text>
  <text x="710" y="356" class="say">Engine run with its skill. Approve?</text>
  <rect x="710" y="380" width="417" height="1.5" fill="#3a3833"/>
  <text x="710" y="414" class="cmd">init-example<tspan class="cmd-text"> · the full Golden-Flow,</tspan></text>
  <text x="710" y="436" class="cmd-text">to study</text>
  <text x="710" y="472" class="cmd">init-strategy<tspan class="cmd-text"> · your own, with the same</tspan></text>
  <text x="710" y="494" class="cmd-text">folders</text>

  <text x="49" y="584" class="foot">Knows your step, what's next and which library to use · plan and approval before writing · the numbers come only from the Lab</text>

