  <text x="66" y="217" class="num">1</text>
  <text x="102" y="217" class="step">Bibliotheca</text>
  <text x="102" y="243" class="skill">read · objective · blueprint</text>

  <rect x="49" y="272" width="302" height="78" fill="#e4e1da"/>
  <text x="66" y="304" class="num">2</text>
  <text x="102" y="304" class="step">Universe</text>
  <text x="102" y="330" class="skill">universe</text>

  <rect x="49" y="359" width="302" height="78" fill="#e4e1da"/>
  <text x="66" y="391" class="num">3</text>
  <text x="102" y="391" class="step">Data</text>
  <text x="102" y="417" class="skill">curator · analyzer</text>

  <rect x="49" y="446" width="302" height="78" fill="#e4e1da"/>
  <text x="66" y="478" class="num">4</text>
  <text x="102" y="478" class="step">Portfolio</text>
  <text x="102" y="504" class="skill">portfolio</text>

  <rect x="360" y="185" width="302" height="78" fill="#e84328"/>
  <text x="377" y="217" class="num-on">5</text>
  <text x="413" y="217" class="step-on">Backtest</text>
  <text x="413" y="243" class="skill-on">backtest</text>

