<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Your researcher and the Lab: one skill per step</title>
  <desc id="desc">Your researcher unites the Investment Lab pipeline, with one skill per step of its eight: 1 Bibliotheca, read, objective and blueprint; 2 Universe, universe; 3 Data, curator and analyzer; 4 Portfolio, portfolio; 5 Backtest, backtest; 6 Attribution, attribution and alpha; 7 Paper trading, the graduation gate; 8 Production, outside the Lab. You ask which step you are on; your researcher answers: step 5, the backtest, with a plan to run the Backtest Engine with its skill, for your approval. init-example copies the full Golden-Flow to study; init-strategy starts yours, with the same folders. It knows which step you are on, what comes next and which library to use; it plans and asks before writing; the numbers come only from the Lab.</desc>
  <style>
    .label { font: 700 14px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 3.5px; fill: #686661; }
    .head { font: 400 38px 'Archivo Black', 'Arial Black', Impact, sans-serif; fill: #121110; letter-spacing: -0.5px; }
    .dot { fill: #e84328; }
    .num { font: 400 22px 'Archivo Black', 'Arial Black', Impact, sans-serif; fill: #e84328; }
    .num-on { font: 400 22px 'Archivo Black', 'Arial Black', Impact, sans-serif; fill: #121110; }
    .step { font: 400 20px 'Archivo Black', 'Arial Black', Impact, sans-serif; fill: #121110; }
    .step-on { font: 400 20px 'Archivo Black', 'Arial Black', Impact, sans-serif; fill: #fff4f1; }
    .step-out { font: 400 20px 'Archivo Black', 'Arial Black', Impact, sans-serif; fill: #56534e; }
    .skill { font: 700 14px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #b8321a; }
    .skill-on { font: 700 14px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #121110; }
    .who { font: 700 17px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0664e; }
    .say { font: 400 18px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f2f0eb; }
    .cmd { font: 700 15px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #f0664e; }
    .cmd-text { font: 400 15px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #f2f0eb; }
    .foot { font: 400 14px Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #56534e; letter-spacing: 0.5px; }
  </style>
  <rect width="1200" height="675" fill="#f2f0eb"/>

