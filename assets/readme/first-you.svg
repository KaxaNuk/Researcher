<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
  <title id="title">First you, then its voice</title>
  <desc id="desc">The interview takes two questions and about three minutes, and asks nothing about markets. Your researcher, Arya, asks: tell me more about yourself, what you do, and the kinds of projects and topics we will be working on together. A portfolio analyst at an asset manager answers, and RESEARCHER.md fills in beside the chat: name, works for, here for, domains. The second question asks how it should talk to you. You can change its voice and everything else later.</desc>
  <style>
    .sans { font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .heavy { font-family: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
  </style>
  <rect width="1200" height="600" fill="#F1EFEA"/>
  <text x="40" y="52" class="sans" font-size="15" letter-spacing="4" fill="#3A3A3A">INSTALL, STEP 3 · THE INTERVIEW, TWO QUESTIONS</text>
  <text x="40" y="112" class="heavy" font-size="46" fill="#111">FIRST YOU, THEN ITS VOICE<tspan fill="#E23B2A">.</tspan></text>
  <text x="40" y="148" class="sans" font-size="20" fill="#2A2A2A">About three minutes, and nothing about markets. “I’m just starting” is an answer too.</text>

  <rect x="40" y="172" width="660" height="370" fill="#111"/>
  <rect x="40" y="172" width="660" height="38" fill="#1C1C1C"/>
  <circle cx="62" cy="191" r="5" fill="#3A3A3A"/><circle cx="80" cy="191" r="5" fill="#3A3A3A"/><circle cx="98" cy="191" r="5" fill="#3A3A3A"/>
  <text x="118" y="197" class="sans" font-size="16" fill="#D8D5CE">Arya · setting up</text>

  <rect x="62" y="226" width="560" height="96" fill="#1E1E1E"/>
  <rect x="62" y="226" width="4" height="96" fill="#E23B2A"/>
  <g class="sans">
    <text x="80" y="250" font-size="13" font-weight="700" letter-spacing="2" fill="#D8D5CE">ABOUT YOU</text>
    <text x="80" y="276" font-size="17" fill="#F1EFEA">Tell me more about yourself: what you do, and the kinds</text>
    <text x="80" y="300" font-size="17" fill="#F1EFEA">of projects and topics we’ll be working on together.</text>
  </g>

  <rect x="150" y="338" width="528" height="124" fill="#E23B2A"/>
  <g class="sans" font-size="17" fill="#fff">
    <text x="168" y="366">I work in finance, as a portfolio analyst at an asset</text>
    <text x="168" y="390">manager. I want to build and test equity strategies,</text>
    <text x="168" y="414">and keep up with the research behind them without</text>
    <text x="168" y="438">drowning in papers.</text>
  </g>
  <text x="62" y="510" class="sans" font-size="15" fill="#8C8983">2 of 2 · How should I talk to you?  Explain as you go · Thorough · Brief …</text>

  <rect x="730" y="172" width="430" height="370" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="731" y="173" width="428" height="38" fill="#E4E1DB"/>
  <line x1="730" y1="211" x2="1160" y2="211" stroke="#111" stroke-width="2"/>
  <text x="748" y="198" class="mono" font-size="17" fill="#111">RESEARCHER.md</text>
  <g class="mono" font-size="14" fill="#111">
    <text x="748" y="246" font-weight="700"># Arya</text>
    <text x="748" y="282"><tspan font-weight="700">Name:</tspan> Arya</text>
    <text x="748" y="312"><tspan font-weight="700">Works for:</tspan> Sofía, portfolio</text>
    <text x="748" y="332">analyst — equity strategies</text>
    <text x="748" y="352">and the research behind them</text>
    <text x="748" y="382"><tspan font-weight="700">Here for:</tspan> Organise what I read,</text>
    <text x="748" y="402">and help with my projects;</text>
    <text x="748" y="422">Build and test a strategy</text>
    <text x="748" y="452"><tspan font-weight="700">Domains:</tspan> Finance</text>
    <text x="748" y="486" font-weight="700">## How it speaks</text>
    <text x="748" y="510" fill="#8C8983">← question 2</text>
  </g>

  <text x="40" y="574" class="sans" font-size="16" fill="#3A3A3A">You can change its voice, and everything else, later</text>
</svg>
