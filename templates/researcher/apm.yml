name: kaxanuk-researcher
version: 0.32.1
description: A KaxaNuk researcher — your own research companion, which you name and teach; it keeps a library of what you read and answers from it with sources, works out your ideas and plans, briefs you each morning and comes with you to every project, work or personal, and teaches you to invest when you want
author: KaxaNuk
license: MIT

# The skills and commands come from the package, KaxaNuk/Researcher, installed once for
# the user, never here; it carries every Investment Lab skill itself. `README.md`'s *Installing and
# updating* has the commands.
dependencies:
  apm: []
  mcp: []

# `uvx --from apm-cli==0.33.0 apm install -g "<this folder>"` installs this home's own `.apm/` for
# the user, beside the package — the agent and the researcher's skill that `interview` writes, and
# any skill or command of the home's own — so the researcher is in every folder. It reaches only
# the targets listed both here and in `~/.apm/apm.yml`. An install with `--target` lists its
# assistant there only when it creates that file; otherwise the package's
# `.apm/skills/init-researcher/scripts/user_targets.py add <your assistant>` lists it, or the next
# update removes what was installed for it. The first four take the agent and the skill; Gemini and
# Windsurf have no agent primitive and take the skill alone. OpenCode is left out: it rejects the
# agent APM writes for it. Never install inside this folder.
targets:
  - claude
  - copilot
  - cursor
  - codex
  - gemini
  - windsurf

# Only `.apm/` deploys, though each install first copies the whole folder into
# `~/.apm/apm_modules/_local/<folder name>/` on this machine; nothing leaves it. On Windows a deep
# path in that copy can fail the install: *Troubleshooting* in the package's `SETUP.md` has the fix.
includes: auto
