# Your settings: the choices a computer or an account would otherwise keep, kept here so they
# travel with your home. On a new computer, another account or another assistant, say `update`:
# it sets everything up again from this file.
#
# Never a key, a token, a password or a holding: this file is in every saved version, and in your
# copy on GitHub. Edit it by hand whenever you like; each skill writes only its own part, on your
# go, and saves a version of it.

# The assistants you use your researcher on, as APM names them: claude, codex, copilot, cursor,
# antigravity. `update` installs the package and this home for each one; `backup` and
# `update` add the ones this computer uses.
assistants: []

# How your saved versions are signed and sent, as `backup` asked. `email`: empty until asked;
# "<>" signs them with your name alone; otherwise the address. `send`: true sends each new version
# to your copy on GitHub, false only when you ask; empty until asked.
versions:
  email:
  send:

# Your daily brief, as `brief setup` last confirmed it; `parts` empty means no brief. `brief setup`
# schedules it from here on another computer or account, asking only for your go, and `brief`
# follows it where nothing is scheduled.
#   parts: work, markets, portfolio, week, health.
#   when: the days and the time, the computer's own, e.g. weekdays 06:00.
#   measures: in the order picked, by the names a dated source gives them.
#   questions: each tied question and its measures, e.g. "2: the 10-year yield; the dollar index".
#   week_day: the day Week and Health are written, e.g. Monday.
#   week_folders: folders beyond the projects table that Week reads, by absolute path.
#   connectors: the calendar, mail and chat connectors Work reads, by the names your assistant
#   gives them.
brief:
  parts: []
  when:
  measures: []
  questions: []
  week_day:
  week_folders: []
  connectors: []
